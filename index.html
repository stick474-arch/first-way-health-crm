<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aetherium · CRM & Board</title>
  <meta name="description" content="Client tracking, contact categorization and board of directors management for Aetherium.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230e7c86'/%3E%3Cpath d='M16 8v16M8 16h16' stroke='white' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32"><rect width="32" height="32" rx="8"/><path d="M16 8v16M8 16h16"/></svg>
        </div>
        <div class="brand-text">
          <strong id="brandName">Aetherium</strong>
          <span>CRM &amp; Board</span>
        </div>
      </div>
      <nav class="nav" id="nav" aria-label="Main"></nav>
      <div class="sidebar-foot" id="sidebarFoot"></div>
    </aside>
    <div class="scrim" id="scrim" data-act="closeSidebar"></div>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn only-mobile" data-act="openSidebar" aria-label="Open menu" id="menuBtn"></button>
        <div class="search" id="searchWrap">
          <span class="search-icon" id="searchIcon"></span>
          <input id="globalSearch" type="search" placeholder="Search contacts, companies, deals, meetings…  ( / )" autocomplete="off" aria-label="Search">
          <div class="search-results" id="searchResults" hidden></div>
        </div>
        <div class="topbar-actions">
          <div class="dropdown" id="newMenu">
            <button class="btn btn-primary" data-act="toggleNewMenu" id="newBtn"></button>
            <div class="menu" hidden id="newMenuList"></div>
          </div>
          <button class="icon-btn" data-act="toggleTheme" aria-label="Toggle dark mode" id="themeBtn"></button>
        </div>
      </header>
      <main class="view" id="view" tabindex="-1"></main>
    </div>
  </div>

  <div id="modals"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div id="printArea"></div>

  <!-- Production entry (sign-in, Supabase). The demo page is generated from this file: node tools/sync-demo.mjs -->
  <script src="js/config.js"></script>
  <script src="js/util.js"></script>
  <script src="js/store.js"></script>
  <script src="js/sample.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/cloud.js"></script>
  <script src="js/actions.js"></script>
  <script src="js/views/parts.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/contacts.js"></script>
  <script src="js/views/organizations.js"></script>
  <script src="js/views/pipeline.js"></script>
  <script src="js/views/activities.js"></script>
  <script src="js/views/tasks.js"></script>
  <script src="js/views/board.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
